name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install constrained backend and development tools
        run: |
          python -m pip install --require-hashes -r packaging/build-constraints.txt
          python -m pip install --no-build-isolation -e '.[dev]'
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Run source and contract gate
        run: ./scripts/check
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install constrained development tools and owned native tools
        run: |
          python -m pip install --require-hashes -r packaging/build-constraints.txt
          python -m pip install --no-build-isolation -e '.[dev]'
          sudo apt-get update
          sudo apt-get install --yes tmux openssh-server
          sudo mkdir -p /run/sshd
      - name: Install reviewed optional Mesh candidate
        run: |
          python - <<'PY_MESH'
          import subprocess, sys, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          source = project["tool"]["uv"]["sources"]["mesh-plus"]
          requirement = "mesh-plus @ git+" + source["git"] + "@" + source["rev"]
          subprocess.run([sys.executable, "-m", "pip", "install", requirement], check=True)
          PY_MESH
      - name: Run Mesh integration and owned native SSH gate
        run: python scripts/check-mesh
