name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install constrained backend and development tools
        run: |
          python -m pip install --require-hashes -r packaging/build-constraints.txt
          python -m pip install --no-build-isolation -e '.[dev]'
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Run source and contract gate
        run: ./scripts/check
      - name: Install frozen optional Mesh candidate and owned SSH tools
        run: |
          python -m pip install 'mesh-plus @ git+https://github.com/byebyebryan/mesh-plus.git@fd40916f2b0e5c9d2a3f8b51d0da02585894ddcb'
          sudo apt-get install --yes openssh-server
          sudo mkdir -p /run/sshd
      - name: Run Mesh integration and owned native SSH gate
        run: python scripts/check-mesh
