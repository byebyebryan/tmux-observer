[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-observer"
version = "0.1.0a1"
description = "Passive default-server tmux observation and explicit read clients"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bryan"}]

[project.optional-dependencies]
dev = ["ruff==0.16.6", "jsonschema>=4.18,<5"]

[project.scripts]
tmux-observer = "tmux_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
