[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-observer"
version = "0.2.0a1"
description = "Passive default-server tmux observation and explicit read clients"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bryan"}]

[project.optional-dependencies]
dev = ["ruff==0.16.6", "jsonschema>=4.18,<5"]

[project.scripts]
tmux-observer = "tmux_observer.cli:main"
tmux-observer-client = "tmux_observer_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tmux-observer/systemd" = ["systemd/*.service"]
"share/tmux-observer/contracts/observation-v1" = ["contracts/observation-v1/*.json", "contracts/observation-v1/*.md", "contracts/observation-v1/SHA256SUMS"]
"share/tmux-observer/contracts/observation-v1/fixtures" = ["contracts/observation-v1/fixtures/*.json"]
"share/tmux-observer/contracts/service-v1" = ["contracts/service-v1/*.json", "contracts/service-v1/*.md", "contracts/service-v1/SHA256SUMS"]
"share/tmux-observer/contracts/service-v1/fixtures" = ["contracts/service-v1/fixtures/*.json"]
"share/tmux-observer/contracts/fleet-v1" = ["contracts/fleet-v1/*.json", "contracts/fleet-v1/*.md", "contracts/fleet-v1/SHA256SUMS"]
"share/tmux-observer/contracts/fleet-v1/fixtures" = ["contracts/fleet-v1/fixtures/*.json"]

"share/tmux-observer/contracts/attachments-v1" = ["contracts/attachments-v1/*.json", "contracts/attachments-v1/*.md", "contracts/attachments-v1/SHA256SUMS"]
"share/tmux-observer/contracts/attachments-v1/fixtures" = ["contracts/attachments-v1/fixtures/*.json"]
"share/tmux-observer/contracts/desktop-v1" = ["contracts/desktop-v1/*.json", "contracts/desktop-v1/*.md", "contracts/desktop-v1/SHA256SUMS"]
"share/tmux-observer/contracts/desktop-v1/fixtures" = ["contracts/desktop-v1/fixtures/*.json"]
"share/tmux-observer/contracts/action-v1" = ["contracts/action-v1/*.json", "contracts/action-v1/*.md", "contracts/action-v1/SHA256SUMS"]
"share/tmux-observer/contracts/action-v1/fixtures" = ["contracts/action-v1/fixtures/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
